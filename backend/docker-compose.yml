version: "3.8"

services:
  photobox-backend:
    build: ./backend
    container_name: photobox-backend
    ports:
      - "18080:18080"
    environment:
      - PORT=18080
      - DB_HOST=192.168.110.220
      - DB_PORT=25432
      - DB_USER=postgres
      - DB_PASSWORD=admin123
      - DB_NAME=photobox
      - DB_SSLMODE=disable
      - JWT_SECRET=your-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:5173
      - NODE_ENV=development
    restart: unless-stopped
