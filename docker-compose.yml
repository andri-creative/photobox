version: "3.8"

services:
  photobox-backend:
    build: ./backend
    container_name: photobox-backend
    ports:
      - "18080:18080"
    environment:
      - PORT=18080
      - DB_HOST=192.168.110.220
      - DB_PORT=25432
      - DB_USER=postgres
      - DB_PASSWORD=admin123
      - DB_NAME=photobox
      - DB_SSLMODE=disable
      - JWT_SECRET=your-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:5173
      - NODE_ENV=development
    restart: unless-stopped

  photobox-socket-gateway:
    build: ./socket-gateway
    container_name: photobox-socket-gateway
    ports:
      - "13001:13001"
    environment:
      - SOCKET_GATEWAY_PORT=13001
      - JWT_SECRET=your-secret-key-change-in-production
      - DB_HOST=192.168.110.220
      - DB_PORT=25432
      - DB_USER=postgres
      - DB_PASSWORD=admin123
      - DB_NAME=photobox
    restart: unless-stopped

  photobox-frontend:
    build: ./frontend
    container_name: photobox-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://192.168.110.220:18080
      - VITE_SOCKET_URL=http://192.168.110.220:13001
    restart: unless-stopped
